<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280, initial-scale=1.0" />
  <title>Integración de Widgets</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      width: 1280px;
      height: 720px;
      position: relative;
    }

    iframe {
      border: none;
    }

    #soundalerts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      transform: scale(0.9);
    }

    #botrix-chat {
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: 350px;
      height: 200px;
      z-index: 4;
      transform: scale(0.8);
      transform-origin: bottom left;
    }

   #throne {
      position: absolute;
    top: 0px;
      right: 330px;
      width: 100%;
      height: 100%;
      z-index: 4;
      transform: scale(0.6);
      transform-origin: bottom right;
    }

    #metas {
      position: absolute;
      bottom: -25px; /* mas es mas arriba */
      left: 50%;
      transform: translateX(-50%) scale(0.6);
      width: 500px;
      height: 140px;
      z-index: 4;
      transform-origin: bottom center;
    }

    #botrix-alerts {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%) scale(0.6);
      width: 1280px;
      height: 720px;
      z-index: 6;
      transform-origin: top center;
    }

     #musica { /* si se desconfigura es la musica */ 
      position: absolute;
      bottom: -355px;   /* menos es mas abajo */ 
      right: -5px; /* menos es mas a la derecha */ 
      width: 400px;
      height: 500px;
      z-index: 8;
      transform: scale(1.1);
      transform-origin: bottom right;
    }

    /* TikTok widgets verticales y pegados al borde derecho */
#alertas-tiktok {
    position: absolute;
    top: 5px;
    right: 20px;
    width: 300px;
    height: 220px;
    z-index: 10;
    transform: scale(1.4);
    transform-origin: top right;
  }

 #donadores-tiktok {
    position: absolute;
    top: 0px; /* Choque con el borde superior */
    right: 0px;
    width: 200px;
    height: 250px;
    z-index: 10;
    transform: scale(0.5);
    transform-origin: top right;
  }

  #corazones-tiktok {
    position: absolute;
    top: 120px; /* menos es más arriba */
    right: 0px;
    width: 200px;
    height: 250px;
    z-index: 10;
    transform: scale(0.5);
    transform-origin: top right;
  }

  #chat-tiktok {
    position: absolute;
    top: 650px;
    right: 0px;
    width: 300px;
    height: 180px;
    z-index: 10;
    transform: scale(0.6);
    transform-origin: top right;
  }
  </style>
</head>
<body>
  <!-- SoundAlerts -->
  <iframe id="soundalerts" src="https://source.soundalerts.com/overlay/fd9ea406-efce-3885-b5f5-868305d5c76c/tZlhgHsRHOlCXqWyS577" allow="autoplay"></iframe>

  <!-- Chat -->
  <iframe id="botrix-chat" src="https://botrix.live/widgets/chat/?bid=hL4jXwuISOTVQTdQVTPC9A&bots=false&emojis=true&hideCommands=false&hideMessages=false&hideMessagesSeconds=10&fontSize=20&trovo=false&twitch=true&youtube=true&kick=false&livespace=true&platformIcon=true&theme=default&ignoredUsers=Jarvis%2C%20syzlo%2C%20Makeyultimate%2C%20"></iframe>

  <!-- Metas -->
  <iframe id="metas" src="https://botrix.live/widgets/goals/bits/?tema=cleanradius&bid=hL4jXwuISOTVQTdQVTPC9A&font=Arial&cantidad=2300&cantidadI=0&d=1000&color=be63ff;ffffff&c=#be63ff#ffffff&texto=BITS%20PARA%20PODER%20RETIRAR" allow="autoplay"></iframe>

  <!-- Throne -->
  <iframe id="throne" src="https://throne.com/stream-alerts/6w1S6ns0Z9aWPlQE8OnnDT1ui0Q2" allow="autoplay"></iframe>

  <!-- Botrix Alerts -->
  <iframe id="botrix-alerts" src="https://botrix.live/alerts?bid=hL4jXwuISOTVQTdQVTPC9A&trovo=false&kick=false&livespace=false" allow="autoplay"></iframe>

  <!-- Música StreamElements -->
  <iframe id="musica" src="https://streamelements.com/overlay/67f48b946d90d3a6d8544cb3/eGeqNplcb4Fa7paZRUYYid9-nED9Ow5lyETRny4-QUKRji48" allow="autoplay"></iframe>
 
  <!-- TikTok Widgets -->
  <iframe id="alertas-tiktok" src="https://tikfinity.zerody.one/widget/firework?cid=1638627"></iframe>
  <iframe id="donadores-tiktok" src="https://tikfinity.zerody.one/widget/topgifter?cid=1638627"></iframe>
  <iframe id="corazones-tiktok" src="https://tikfinity.zerody.one/widget/topliker?cid=1638627"></iframe>
  <iframe id="chat-tiktok" src="https://tikfinity.zerody.one/widget/chat?cid=1638627"></iframe>
</body>
</html>
